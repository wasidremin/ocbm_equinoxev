[package]
name = "box-common"
version = "0.1.0"
edition = "2021"
license = "Unlicense"

# Box-side foundation shared by ocbmd and btd:
#
#   box-common
#   ├── ocbm   — OCBM framing/channels (re-exports ocbm-proto)
#   ├── flags  — the projection-owner flag the supervisor writes and ocbmd forwards
#   └── net    — the SoftAP gateway address
#
# The Android Auto pieces (usb, phone, cfg) were removed on 2026-10-27.

[dependencies]
ocbm-proto = { path = "../ocbm-proto" }
