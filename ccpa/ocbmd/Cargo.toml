[package]
name = "ocbmd"
version = "0.1.0"
edition = "2021"
description = "Box-side OCBM daemon (armv7/musl): owns /dev/usb_accessory; CTRL/ECHO/CONSOLE/MFI channels"

[[bin]]
name = "ocbmd"
path = "src/main.rs"

[dependencies]
ocbm-proto = { path = "../../crates/ocbm-proto" }
box-common = { path = "../../crates/box-common" }
libc = "0.2"
# The Wi-Fi link (src/wifi.rs, T15): OCBM over TCP behind a pre-shared-key handshake and
# ChaCha20-Poly1305 records. Off unless /etc/ocbm/wifi_link holds a key. Its crypto crates are the
# ones carplayd already links.
ocbm-link = { path = "../../crates/ocbm-link" }
