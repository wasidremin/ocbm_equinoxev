name: evinsights
services:
  db:
    image: timescale/timescaledb:2.19.3-pg16
    environment:
      POSTGRES_DB: evinsights
      POSTGRES_USER: evinsights
      POSTGRES_PASSWORD: ${DB_PASSWORD:?Set DB_PASSWORD in .env}
    volumes:
      - database:/var/lib/postgresql/data
    healthcheck:
      test: [CMD-SHELL, 'pg_isready -U evinsights -d evinsights']
      interval: 5s
      timeout: 3s
      retries: 30
  migrate:
    build: ./backend
    environment: &backend-env
      DATABASE_URL: postgresql+psycopg://evinsights:${DB_PASSWORD}@db:5432/evinsights
      KEY_PEPPER: ${KEY_PEPPER:?Set KEY_PEPPER in .env}
      ADMIN_TOKEN: ${ADMIN_TOKEN:?Set ADMIN_TOKEN in .env}
      ALLOW_SYNTHETIC: ${ALLOW_SYNTHETIC:-false}
    depends_on:
      db: {condition: service_healthy}
    command: [alembic, upgrade, head]
  api:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    volumes:
      - ./samples:/app/samples:ro
    healthcheck:
      test: [CMD, python, -c, "import urllib.request; urllib.request.urlopen('http://localhost:8000/api/v1/health')"]
      interval: 10s
      timeout: 5s
      retries: 10
    restart: unless-stopped
  worker:
    build: ./backend
    environment: *backend-env
    depends_on:
      migrate: {condition: service_completed_successfully}
    command: [python, -m, app.worker]
    restart: unless-stopped
    healthcheck:
      test: [CMD, python, -m, app.worker, --health]
      interval: 30s
      timeout: 5s
      retries: 3
  web:
    build: ./frontend
    restart: unless-stopped
    healthcheck:
      test: [CMD, wget, -q, -O, /dev/null, 'http://127.0.0.1/']
      interval: 10s
      timeout: 3s
      retries: 5
  caddy:
    image: caddy:2.10-alpine
    ports: ['${HTTP_BIND:-127.0.0.1}:${HTTP_PORT:-8088}:80']
    volumes:
      - ./Caddyfile:/etc/caddy/Caddyfile:ro
      - caddy_data:/data
      - caddy_config:/config
    depends_on:
      api: {condition: service_healthy}
      web: {condition: service_healthy}
    restart: unless-stopped
volumes:
  database:
  caddy_data:
  caddy_config:
