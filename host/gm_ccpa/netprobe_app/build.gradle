// Gradle packaging and Play publishing path for wasidremin.gmccpa.
buildscript {
    repositories { google(); mavenCentral(); gradlePluginPortal() }
    dependencies {
        classpath 'com.android.tools.build:gradle:8.7.3'
        classpath 'org.jetbrains.kotlin:kotlin-gradle-plugin:2.0.21'
        classpath 'com.github.triplet.gradle:play-publisher:3.9.1'
    }
}

allprojects {
    repositories { google(); mavenCentral() }
    // Build output must not enter an iCloud-synced checkout or the publication mirror.
    def cacheRoot = System.getenv('GM_BUILD_DIR') ?: "${System.getProperty('user.home')}/.cache/carlink-artifacts/gm_ccpa/gradle"
    buildDir = file("${cacheRoot}/${project == rootProject ? 'root' : project.name}")
}
