plugins {
    id 'com.android.application'
    id 'org.jetbrains.kotlin.android'
    id 'com.github.triplet.play'
}

android {
    namespace "wasidremin.gmccpa"
    compileSdk 35

    defaultConfig {
        applicationId "wasidremin.gmccpa"
        minSdk 26
        targetSdk 35
        versionCode Integer.parseInt(System.getenv("AAB_VERSION_CODE") ?: "8")
        versionName System.getenv("AAB_VERSION_NAME") ?: "4.0+781778b-dirty"
    }

    flavorDimensions "distribution"
    productFlavors {
        sideload {
            dimension "distribution"
        }
        play {
            dimension "distribution"
        }
    }

    sourceSets {
        main.java.srcDirs = ["src/main/java"]
        main.jniLibs.srcDirs = ["${rootProject.projectDir}/build/jniLibs"]
    }

    signingConfigs {
        release {
            def keyDir = System.getenv("PLAY_KEY_DIR") ?: "${System.getProperty('user.home')}/CodeSigning/wasidremin-gmccpa"
            def passwordFile = file(System.getenv("PLAY_KEY_PASSWORD_FILE") ?: "${keyDir}/keystore-password.txt")
            def password = passwordFile.text.trim()
            storeFile file(System.getenv("PLAY_KEYSTORE") ?: "${keyDir}/upload-key.jks")
            storePassword password
            keyAlias System.getenv("PLAY_KEY_ALIAS") ?: "upload"
            keyPassword password
        }
    }

    buildTypes {
        debug {
            debuggable true
        }
        release {
            minifyEnabled false
            signingConfig signingConfigs.release
            proguardFiles 'proguard-rules.pro'
        }
    }

    compileOptions {
        sourceCompatibility JavaVersion.VERSION_1_8
        targetCompatibility JavaVersion.VERSION_1_8
    }
    kotlinOptions { jvmTarget = '1.8' }
    packagingOptions { jniLibs { useLegacyPackaging = false } }
}

// Same publishing contract as the sister app: only an explicit publish task uploads anything.
play {
    def serviceAccountPath = System.getenv("PLAY_SERVICE_ACCOUNT") ?: "${rootProject.projectDir}/play-service-account.json"
    serviceAccountCredentials = file(serviceAccountPath)
    track = "automotive:internal"
    releaseStatus = com.github.triplet.gradle.androidpublisher.ReleaseStatus.COMPLETED
    defaultToAppBundles = true
}

dependencies {
    // android.car is an AAOS optional platform library: compile against its API 35 stub, but
    // do not package it. The real library is supplied by the head unit and the manifest declares
    // it as an optional uses-library.
    def sdkDir = System.getenv("ANDROID_SDK_ROOT") ?: (System.getenv("ANDROID_HOME") ?: "${System.getProperty('user.home')}/Android/Sdk")
    compileOnly files("${sdkDir}/platforms/android-35/optional/android.car.jar")
}
